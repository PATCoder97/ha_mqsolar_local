reboot_charge:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mqsolar_local
    topic_code:
      default: 45a
      selector:
        text:

get_charger_config:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mqsolar_local
    topic_code:
      default: 45a
      selector:
        text:

set_charger_config:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mqsolar_local
    topic_code:
      default: 45a
      selector:
        text:
    charge_mode:
      required: true
      selector:
        select:
          options:
            - "0"
            - "1"
    max_current:
      required: true
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          mode: box
    max_voltage:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    confirm:
      required: true
      default: false
      selector:
        boolean:
